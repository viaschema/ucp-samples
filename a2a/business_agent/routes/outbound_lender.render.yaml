data:
- attributes:
    host_endpoint: business-agent-b13r.onrender.com
    destination_override_endpoint: '*'
    port: 443
    protocol: http
    source_endpoint: '*'
    tags:
      name: Lender Outbound Route (Render)
    entries:
      - classifiers: {}
        config:
          condition: AND
          rules:
            - expression:
                field: PathInfo
                operator: matches
                type: string
                values:
                  - /lender-api/.*
