          - $.first_name
          - $.last_name
          - $.email
          - $.phone_number
          - $.annual_income
          - $.date_of_birth
          - $.monthly_housing_payment
          - $.employer_phone_number
          - $.living_situation
          - $.address_street_address
          - $.address_address_locality
          - $.address_address_region
          - $.address_postal_code
          - $.address_address_country
          - $.employer_address_street_address
          - $.employer_address_address_locality
          - $.employer_address_address_region
          - $.employer_address_postal_code
          - $.employer_address_address_country
